<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Inicio de sesión de MicroStock"
    >

    <title>MicroStock | Iniciar sesión</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card" aria-labelledby="loginTitle">

            <div class="auth-header">
                <div class="auth-logo">
                    MS
                </div>

                <h1 id="loginTitle">
                    MicroStock
                </h1>

                <p>
                    Gestión inteligente de inventarios
                </p>
            </div>

            <form id="loginForm" novalidate>

                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        autocomplete="email"
                        maxlength="100"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                    <small
                        class="field-error"
                        id="correoError"
                        aria-live="polite"
                    ></small>

                </div>

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            maxlength="100"
                            placeholder="Ingrese su contraseña"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Mostrar contraseña"
                        >
                            Mostrar
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="passwordError"
                        aria-live="polite"
                    ></small>

                </div>

                <div
                    id="loginMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                ></div>

                <button
                    type="submit"
                    id="loginButton"
                    class="btn-primary btn-full"
                >
                    Iniciar sesión
                </button>

            </form>

            <div class="auth-footer">

                <p>
                    ¿No tienes cuenta?
                    <a href="register.html">
                        Regístrate aquí
                    </a>
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
