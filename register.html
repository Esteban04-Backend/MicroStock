<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Registro de usuarios de MicroStock"
    >

    <title>MicroStock | Crear cuenta</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card auth-card-register">

            <div class="auth-header">

                <div class="auth-logo">
                    MS
                </div>

                <h1>
                    Crear cuenta
                </h1>

                <p>
                    Regístrate en MicroStock
                </p>

            </div>

            <form
                id="registerForm"
                novalidate
            >

                <div class="form-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        autocomplete="name"
                        maxlength="100"
                        placeholder="Ingrese su nombre"
                        required
                    >

                    <small
                        class="field-error"
                        id="nombreError"
                        aria-live="polite"
                    ></small>

                </div>

                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        autocomplete="email"
                        maxlength="100"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                    <small
                        class="field-error"
                        id="correoError"
                        aria-live="polite"
                    ></small>

                </div>

                <div class="form-group">

                    <label for="rol">
                        Rol
                    </label>

                    <select
                        id="rol"
                        name="rol"
                        required
                    >

                        <option value="">
                            Seleccione un rol
                        </option>

                    </select>

                    <small
                        class="field-error"
                        id="rolError"
                        aria-live="polite"
                    ></small>

                </div>

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="new-password"
                            maxlength="100"
                            placeholder="Mínimo 6 caracteres"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Mostrar contraseña"
                        >
                            Mostrar
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="passwordError"
                        aria-live="polite"
                    ></small>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            autocomplete="new-password"
                            maxlength="100"
                            placeholder="Repita la contraseña"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword"
                            aria-label="Mostrar confirmación de contraseña"
                        >
                            Mostrar
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="confirmPasswordError"
                        aria-live="polite"
                    ></small>

                </div>

                <div
                    id="registerMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                ></div>

                <button
                    type="submit"
                    id="registerButton"
                    class="btn-primary btn-full"
                >
                    Crear cuenta
                </button>

            </form>

            <div class="auth-footer">

                <p>
                    ¿Ya tienes una cuenta?
                    <a href="login.html">
                        Inicia sesión
                    </a>
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
