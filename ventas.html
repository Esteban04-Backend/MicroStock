<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>MicroStock | Punto de Venta</title>

<link rel="stylesheet" href="styles.css">

<!--
    IMPORTANTE:
    Este script debe cargarse ANTES del script inline de esta página,
    ya que aquí vive apiFetch(), getToken(), getUsuarioActual() y
    escapeHTML(), que son necesarios para autenticar las peticiones
    y evitar inyección de HTML.
-->
<script src="script.js" defer></script>

<style>

.pos-container{
display:grid;
grid-template-columns:2fr 3fr 1.5fr;
gap:20px;
padding:20px;
}

.panel{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.product-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:15px;
}

.product-card{
background:#f4f6f8;
padding:15px;
border-radius:8px;
cursor:pointer;
text-align:center;
}

.product-card:hover{
background:#e3e8ee;
}

input,select{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
}

button{
padding:10px;
cursor:pointer;
border:none;
background:#1976d2;
color:white;
border-radius:6px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

.total-box{
font-size:28px;
font-weight:bold;
margin-top:20px;
}

.btn-finalizar{
width:100%;
padding:15px;
font-size:18px;
background:#2e7d32;
margin-top:20px;
}

.btn-finalizar:disabled{
background:#9e9e9e;
cursor:not-allowed;
}

.sin-resultados{
grid-column:1 / -1;
text-align:center;
color:#777;
padding:15px 0;
}

</style>

</head>

<body>

<header>

<h1>MicroStock</h1>
<p>Punto de Venta</p>

</header>

<nav>

<ul>

<li><a href="index.html">Dashboard</a></li>
<li><a href="productos.html">Productos</a></li>
<li><a href="categorias.html">Categorías</a></li>
<li><a href="proveedores.html">Proveedores</a></li>
<li><a href="clientes.html">Clientes</a></li>
<li><a href="ventas.html">Ventas</a></li>
<li><a href="compras.html">Compras</a></li>
<li><a href="inventario.html">Inventario</a></li>
<li><a href="movimientos_inventario.html">Movimientos</a></li>
<li><a href="alertas_stock.html">Alertas</a></li>
<li><a href="usuarios.html">Usuarios</a></li>

</ul>

</nav>

<div class="pos-container">


<!-- PANEL PRODUCTOS -->

<div class="panel">

<h2>Agregar producto</h2>

<label>Producto</label>

<select id="productoSeleccion">

<option value="">Seleccionar producto</option>

</select>

<label>Cantidad</label>

<input type="number" id="cantidad" value="1" min="1">

<button onclick="agregarDesdeSelector()">Agregar</button>


<h3>Acceso rápido</h3>

<input type="text" id="buscarProducto" placeholder="Buscar..." onkeyup="buscarProducto()">

<div id="listaProductos" class="product-grid"></div>

</div>


<!-- CARRITO -->

<div class="panel">

<h2>Carrito de venta</h2>

<table>

<thead>

<tr>

<th>Producto</th>
<th>Precio</th>
<th>Cantidad</th>
<th>Subtotal</th>
<th></th>

</tr>

</thead>

<tbody id="carrito"></tbody>

</table>

</div>


<!-- TOTAL -->

<div class="panel">

<h2>Resumen</h2>

<label>Cliente</label>

<select id="clienteVenta">

<option value="">Seleccione un cliente</option>

</select>

<div class="total-box">

Total: $ <span id="total">0</span>

</div>

<button
    class="btn-finalizar"
    id="btnFinalizar"
    onclick="finalizarVenta()"
>

FINALIZAR VENTA

</button>

</div>

</div>


<script>

/* =========================================================
   ESTADO
   ========================================================= */

let carrito = [];
let productos = [];
let clientes = [];


/* =========================================================
   CARGA INICIAL (productos + clientes)

   Se usa apiFetch() (definido en script.js) en lugar de fetch()
   directo, para que el header "Authorization: Bearer <token>"
   viaje en cada petición. Sin esto, el backend responde 401
   y los desplegables quedan vacíos aunque haya datos en la BD.
   ========================================================= */

async function cargarProductos(){

    try{

        const respuestaProductos = await apiFetch("/productos");
        const dataProductos = await getJSON(respuestaProductos);

        if(!respuestaProductos.ok){

            console.error("Error obteniendo productos:", dataProductos);
            showMessageGlobal(
                dataProductos.error ||
                dataProductos.message ||
                "No se pudieron cargar los productos."
            );
            return;

        }

        productos = dataProductos;

        const respuestaClientes = await apiFetch("/clientes");
        const dataClientes = await getJSON(respuestaClientes);

        if(!respuestaClientes.ok){

            console.error("Error obteniendo clientes:", dataClientes);
            showMessageGlobal(
                dataClientes.error ||
                dataClientes.message ||
                "No se pudieron cargar los clientes."
            );
            return;

        }

        clientes = dataClientes;

        renderizarProductos(productos);
        renderizarSelectorProductos(productos);
        renderizarSelectorClientes(clientes);

    }catch(error){

        console.error("Error cargando datos iniciales:", error);
        showMessageGlobal("Error de conexión con el servidor.");

    }

}


function renderizarSelectorProductos(lista){

    const selector = document.getElementById("productoSeleccion");

    selector.innerHTML = "<option value=''>Seleccionar producto</option>";

    lista.forEach((p, i) => {

        const option = document.createElement("option");
        option.value = i;
        option.textContent = p.nombre_producto;
        selector.appendChild(option);

    });

}


function renderizarSelectorClientes(lista){

    const selectorCliente = document.getElementById("clienteVenta");

    selectorCliente.innerHTML = "<option value=''>Seleccione un cliente</option>";

    lista.forEach(c => {

        const option = document.createElement("option");
        option.value = c.id_cliente;
        option.textContent = c.nombre_cliente;
        selectorCliente.appendChild(option);

    });

}


function renderizarProductos(lista){

    const grid = document.getElementById("listaProductos");

    grid.innerHTML = "";

    if(lista.length === 0){

        grid.innerHTML =
            "<p class='sin-resultados'>No hay productos disponibles.</p>";
        return;

    }

    lista.forEach(p => {

        const card = document.createElement("div");
        card.className = "product-card";

        card.innerHTML = `
        <strong>${escapeHTML(p.nombre_producto)}</strong>
        <br>
        $${escapeHTML(p.precio_unitario)}
        `;

        card.onclick = () => agregarCarrito(p, 1);

        grid.appendChild(card);

    });

}


/* =========================================================
   CARRITO
   ========================================================= */

function agregarDesdeSelector(){

    const index = document.getElementById("productoSeleccion").value;
    const cantidad = parseInt(document.getElementById("cantidad").value, 10);

    if(index === ""){

        alert("Seleccione producto");
        return;

    }

    if(!Number.isInteger(cantidad) || cantidad <= 0){

        alert("Ingrese una cantidad válida.");
        return;

    }

    const producto = productos[index];

    agregarCarrito(producto, cantidad);

}


function agregarCarrito(producto, cantidad){

    const stockDisponible = Number(producto.stock_actual);

    const item = carrito.find(
        p => p.id_producto === producto.id_producto
    );

    const cantidadTotal = (item ? item.cantidad : 0) + cantidad;

    if(!Number.isNaN(stockDisponible) && cantidadTotal > stockDisponible){

        alert(
            `Stock insuficiente. Disponible: ${stockDisponible}`
        );
        return;

    }

    if(item){

        item.cantidad += cantidad;

    }else{

        carrito.push({

            id_producto: producto.id_producto,
            nombre: producto.nombre_producto,
            precio: Number(producto.precio_unitario),
            cantidad: cantidad

        });

    }

    actualizarCarrito();

}


function quitarDelCarrito(idProducto){

    carrito = carrito.filter(p => p.id_producto !== idProducto);
    actualizarCarrito();

}


function actualizarCarrito(){

    const tabla = document.getElementById("carrito");
    tabla.innerHTML = "";

    let total = 0;

    carrito.forEach(p => {

        const subtotal = p.precio * p.cantidad;
        total += subtotal;

        const fila = document.createElement("tr");

        fila.innerHTML = `
        <td>${escapeHTML(p.nombre)}</td>
        <td>${escapeHTML(p.precio)}</td>
        <td>${escapeHTML(p.cantidad)}</td>
        <td>${escapeHTML(subtotal)}</td>
        <td><button type="button" data-id="${p.id_producto}" class="btn-quitar">✕</button></td>
        `;

        tabla.appendChild(fila);

    });

    tabla.querySelectorAll(".btn-quitar").forEach(btn => {

        btn.addEventListener("click", () => {

            quitarDelCarrito(Number(btn.dataset.id));

        });

    });

    document.getElementById("total").innerText = total;

}


/* =========================================================
   FINALIZAR VENTA

   Usa apiFetch() para incluir el token, y toma el usuario
   desde la sesión activa (getUsuarioActual()) en lugar de
   un id fijo, ya que un id "quemado" en el código puede no
   existir en la tabla Usuario y el backend rechaza la venta
   con "El usuario no existe."
   ========================================================= */

async function finalizarVenta(){

    if(carrito.length === 0){

        alert("Debe agregar productos");
        return;

    }

    const cliente = document.getElementById("clienteVenta").value;

    if(cliente === ""){

        alert("Seleccione un cliente");
        return;

    }

    const usuarioActual = getUsuarioActual();

    if(!usuarioActual || !usuarioActual.id_usuario){

        alert("No se encontró la sesión del usuario. Inicie sesión nuevamente.");
        window.location.href = "login.html";
        return;

    }

    const datos = {

        cliente: Number(cliente),
        usuario: usuarioActual.id_usuario,
        productos: carrito

    };

    const btnFinalizar = document.getElementById("btnFinalizar");
    btnFinalizar.disabled = true;
    btnFinalizar.textContent = "Procesando...";

    try{

        const respuesta = await apiFetch(
            "/ventas/completa",
            {
                method: "POST",
                body: JSON.stringify(datos)
            }
        );

        const resultado = await getJSON(respuesta);

        if(respuesta.ok){

            alert(resultado.mensaje || "Venta registrada correctamente.");

            carrito = [];
            actualizarCarrito();
            cargarProductos();

        }else{

            alert(resultado.error || resultado.message || "No se pudo registrar la venta.");

        }

    }catch(error){

        console.error("Error registrando venta:", error);
        alert("Error de conexión con el servidor.");

    }finally{

        btnFinalizar.disabled = false;
        btnFinalizar.textContent = "FINALIZAR VENTA";

    }

}


/* =========================================================
   BÚSQUEDA
   ========================================================= */

function buscarProducto(){

    const texto = document.getElementById("buscarProducto").value.toLowerCase();

    const filtrados = productos.filter(p =>
        p.nombre_producto.toLowerCase().includes(texto)
    );

    renderizarProductos(filtrados);

}


/* =========================================================
   MENSAJES GLOBALES (fallback simple si showMessage de
   script.js requiere un contenedor que esta página no tiene)
   ========================================================= */

function showMessageGlobal(texto){

    if(typeof showMessage === "function"){

        console.error(texto);

    }

    alert(texto);

}


/* =========================================================
   INICIO
   ========================================================= */

document.addEventListener("DOMContentLoaded", cargarProductos);

</script>

</body>

</html>
